name: Backend quality

on:
  push:
    branches:
      - main
      - feature/edu-ride-backend-foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduride
          POSTGRES_PASSWORD: eduride_test
          POSTGRES_DB: eduride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduride -d eduride_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://eduride:eduride_test@localhost:5432/eduride_test
      PORT: 0
      CORS_ORIGIN: https://parent-app.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Apply database schema
        working-directory: backend
        run: npm run migrate
      - name: Run unit and integration tests
        working-directory: backend
        run: npm test
