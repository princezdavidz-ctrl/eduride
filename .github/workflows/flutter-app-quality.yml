name: Flutter app quality

on:
  push:
    branches:
      - main
      - feature/edu-ride-main-app-ui-refresh
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter-app-quality.yml"

permissions:
  contents: read

jobs:
  flutter-quality:
    name: Format, analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >
          dart format --output=none --set-exit-if-changed
          lib/core/theme/app_theme.dart
          lib/features/auth/presentation/auth_widgets.dart
          lib/features/auth/presentation/splash_screen.dart
          lib/features/trips/presentation/home_screen.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub
